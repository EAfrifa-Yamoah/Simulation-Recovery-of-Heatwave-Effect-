name: tests and quick pipeline
on: [push, pull_request]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: '4.3' }
      - uses: r-lib/actions/setup-pandoc@v2
      - name: packages
        run: Rscript -e 'install.packages(c("testthat", "mgcv"))'
      - name: tests
        run: make test
      - name: quick pipeline, tables, figures, document
        run: |
          sudo apt-get install -y poppler-utils
          make quick tables figures doc
      - uses: actions/upload-artifact@v4
        with: { name: quick-outputs, path: "figures/*.png" }
